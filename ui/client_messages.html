<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Chat History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/client_messages.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span id="clientNameHeader"></span>
            <span id="clientPhoneHeader" style="margin-left:12px;color:#888;font-size:15px;"></span>
            <span id="leadIdHeader" style="margin-left:12px;color:#888;font-size:15px;"></span>
        </div>
        <div id="chatHistory" class="chat-history"></div>
        <form id="sendMessageForm" class="chat-input-row" style="display:flex;gap:8px;padding:12px 18px 18px 18px;align-items:center;">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" style="flex:1;padding:10px;border-radius:18px;border:1px solid #d1d5db;font-size:15px;">
            <input type="file" id="attachmentInput" accept="image/*,application/pdf" style="display:none;">
            <button type="button" id="attachBtn" style="padding:10px 14px;border-radius:18px;background:#352703;color:#fff;border:none;font-weight:bold;cursor:pointer;" title="Send Attachment">
                <span id="attachIcon">📁</span>
            </button>
            <button type="button" id="recordBtn" style="padding:10px 14px;border-radius:18px;background:#c2cfec;color:#fff;border:none;font-weight:bold;cursor:pointer;margin-right:4px;" title="Record Voice">
                <span id="micIcon">🎙️</span>
            </button>
            <button type="submit" id="sendBtn" style="padding:10px 22px;border-radius:18px;background:#2dbe60;color:#fff;border:none;font-weight:bold;cursor:pointer;">Send</button>
        </form>
    </div>
    <!-- Add audio element for notification sound -->
    <audio id="newMsgSound" src="/sound/notification.wav" preload="auto"></audio>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // Utility: Get URL params
        function getUrlParams() {
            const params = {};
            window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m, key, value) {
                params[key] = decodeURIComponent(value);
            });
            return params;
        }

        // Play notification sound
        function playNewMessageSound() {
            const audio = document.getElementById('newMsgSound');
            if (audio) {
                // Try to resume audio context if suspended (required by some browsers)
                if (audio.context && audio.context.state === 'suspended') {
                    audio.context.resume();
                }
                audio.currentTime = 0;
                // Play only if user has interacted with the page
                audio.play().catch((e) => {
                    // If play fails, prompt user to interact
                    console.warn('Audio play failed, user interaction required:', e);
                });
            }
        }

        // On first user interaction, unlock audio
        document.body.addEventListener('click', function unlockAudio() {
            const audio = document.getElementById('newMsgSound');
            if (audio) {
                audio.play().catch(() => {});
                audio.pause();
                audio.currentTime = 0;
            }
            document.body.removeEventListener('click', unlockAudio);
        });

        // Render chat messages and play sound if new
        function renderChat(messages, clientPhone, playSoundIfNew = false) {
            const chatDiv = document.getElementById('chatHistory');
            const prevLastId = window.lastMessageId || null;
            chatDiv.innerHTML = '';
            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-message ' + (msg.fromMe ? 'me' : 'client');
                // Render voice messages, attachments, or text
                let bodyHtml = '';
                if (msg.type === 'audio' || msg.type === 'ptt' || msg.type === 'voice') {
                    if (msg.mediaUrl) {
                        bodyHtml = `<audio controls src="${msg.mediaUrl}"></audio>`;
                    } else if (msg.base64) {
                        bodyHtml = `<audio controls src="data:audio/ogg;base64,${msg.base64}"></audio>`;
                    } else {
                        bodyHtml = `<span style="color:#888;">[Voice message]</span>`;
                    }
                } else if (msg.type === 'image' && msg.base64) {
                    // Show image attachment
                    bodyHtml = `<img src="data:${msg.mimetype || 'image/jpeg'};base64,${msg.base64}" alt="Image" style="max-width:220px;max-height:220px;border-radius:8px;box-shadow:0 2px 8px #0002;">`;
                    if (msg.caption) {
                        bodyHtml += `<div style="margin-top:4px;font-size:13px;color:#333;">${msg.caption}</div>`;
                    }
                } else if (msg.type === 'document' && msg.filename && msg.base64) {
                    // Show document (e.g. PDF) as download link
                    const mime = msg.mimetype || 'application/octet-stream';
                    bodyHtml = `<a href="data:${mime};base64,${msg.base64}" download="${msg.filename}" target="_blank" style="color:#2563eb;text-decoration:underline;font-weight:bold;">📄 ${msg.filename}</a>`;
                    if (msg.caption) {
                        bodyHtml += `<div style="margin-top:4px;font-size:13px;color:#333;">${msg.caption}</div>`;
                    }
                } else {
                    bodyHtml = msg.body;
                }
                msgDiv.innerHTML = `
                    <div class="msg-body">${bodyHtml}</div>
                    <div class="msg-meta">${new Date(msg.timestamp * 1000).toLocaleString()}</div>
                `;
                chatDiv.appendChild(msgDiv);
            });
            chatDiv.scrollTop = chatDiv.scrollHeight;
            // Play sound if new message arrived (and it's not the first load)
            if (playSoundIfNew && messages.length && prevLastId && messages[messages.length - 1].id !== prevLastId) {
                playNewMessageSound();
            }
            window.lastMessageId = messages.length ? messages[messages.length - 1].id : null;
        }

        // Fetch chat history from backend
        async function fetchChatHistory(clientPhone) {
            // The backend expects the phone in WhatsApp format (with country code, no +)
            const res = await fetch(`/chat-history?phonenumber=${encodeURIComponent(clientPhone)}`);
            const data = await res.json();
            return data.messages || [];
        }

        // Send message to backend
        async function sendMessageToClient({ clientId, name, phone, leadId, userId }, message) {
            // Save as a new template, then send via /send-message-activity
            const saveRes = await fetch('/templates', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: message })
            });
            const saveResult = await saveRes.json();
            if (!saveResult.success) throw new Error('Failed to save custom template');
            // Get the new template id (assume last one)
            const templatesRes = await fetch('/templates');
            const templatesData = await templatesRes.json();
            const lastTemplate = templatesData.templates[templatesData.templates.length - 1];
            // Send message with all required data
            const sendRes = await fetch('/send-message-activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId,
                    templateId: lastTemplate.id,
                    leadId,
                    userId
                })
            });
            const sendResult = await sendRes.json();
            if (!sendResult.success) throw new Error(sendResult.message || 'Failed to send message');
            return sendResult;
        }

        // --- Voice Recording Logic ---
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        const recordBtn = document.getElementById('recordBtn');
        const micIcon = document.getElementById('micIcon');
        recordBtn.addEventListener('click', async function () {
            if (isRecording) {
                // Stop recording
                mediaRecorder && mediaRecorder.stop();
                recordBtn.disabled = true;
                micIcon.textContent = '⏹️';
                return;
            }
            // Start recording
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Try a more compatible mimeType for MediaRecorder
                let mimeType = '';
                let fileExt = 'webm';
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    mimeType = 'audio/webm;codecs=opus';
                    fileExt = 'webm';
                } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    mimeType = 'audio/webm';
                    fileExt = 'webm';
                } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
                    mimeType = 'audio/ogg;codecs=opus';
                    fileExt = 'ogg';
                } else if (MediaRecorder.isTypeSupported('audio/wav')) {
                    mimeType = 'audio/wav';
                    fileExt = 'wav';
                } else {
                    mimeType = '';
                    fileExt = 'webm';
                }
                mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                mediaRecorder.onstop = async () => {
                    isRecording = false;
                    recordBtn.disabled = false;
                    micIcon.textContent = '🎙️';
                    stream.getTracks().forEach(track => track.stop());
                    if (audioChunks.length === 0) return;
                    // Use the same mimeType and extension as recording
                    const audioBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
                    // Upload to backend
                    try {
                        const params = getUrlParams();
                        const clientId = params.clientid;
                        const clientPhone = params.phonenumber;
                        const leadId = params.lead_id;
                        const userId = params.user_id;
                        const formData = new FormData();
                        formData.append('voice', audioBlob, `voice.${fileExt}`);
                        formData.append('clientId', clientId);
                        formData.append('phonenumber', clientPhone);
                        formData.append('leadId', leadId);
                        formData.append('userId', userId);
                        const res = await fetch('/send-voice-message', {
                            method: 'POST',
                            body: formData
                        });
                        const result = await res.json();
                        if (result.success) {
                            setTimeout(async () => {
                                const messages = await fetchChatHistory(clientPhone);
                                renderChat(messages, clientPhone, true);
                            }, 1200);
                        } else {
                            alert('Failed to send voice message: ' + (result.message || result.error || 'Unknown error'));
                        }
                    } catch (err) {
                        alert('Voice upload failed: ' + (err.message || err));
                    }
                };
                mediaRecorder.onerror = (e) => {
                    isRecording = false;
                    recordBtn.disabled = false;
                    micIcon.textContent = '🎙️';
                    alert('Recording error: ' + (e.error && e.error.message ? e.error.message : 'Unknown error'));
                };
                mediaRecorder.start();
                isRecording = true;
                micIcon.textContent = '⏺️';
            } catch (err) {
                alert('Could not start recording: ' + (err.message || err));
            }
        });

        // --- Attachment Sending Logic ---
        const attachBtn = document.getElementById('attachBtn');
        const attachmentInput = document.getElementById('attachmentInput');
        attachBtn.addEventListener('click', () => {
            attachmentInput.value = '';
            attachmentInput.click();
        });
        attachmentInput.addEventListener('change', async function () {
            if (!attachmentInput.files || attachmentInput.files.length === 0) return;
            const file = attachmentInput.files[0];
            // Only allow images and pdfs
            if (!/^image\//.test(file.type) && file.type !== 'application/pdf') {
                alert('Only images and PDF files are allowed.');
                return;
            }
            attachBtn.disabled = true;
            attachBtn.style.opacity = '0.6';
            try {
                const params = getUrlParams();
                const clientId = params.clientid;
                const clientPhone = params.phonenumber;
                const leadId = params.lead_id;
                const userId = params.user_id;
                const formData = new FormData();
                formData.append('attachment', file, file.name);
                formData.append('clientId', clientId);
                formData.append('phonenumber', clientPhone);
                // Optionally, add a caption from the input box
                const caption = document.getElementById('messageInput').value.trim();
                if (caption) formData.append('caption', caption);

                const res = await fetch('/send-attachment', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                if (result.success) {
                    document.getElementById('messageInput').value = '';
                    setTimeout(async () => {
                        const messages = await fetchChatHistory(clientPhone);
                        renderChat(messages, clientPhone, true);
                    }, 1200);
                } else {
                    alert('Failed to send attachment: ' + (result.message || result.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Attachment upload failed: ' + (err.message || err));
            }
            attachBtn.disabled = false;
            attachBtn.style.opacity = '';
        });

        // Realtime chat polling using Socket.IO
        let lastMessageId = null;
        let clientPhoneGlobal = null;

        function updateChatRealtime(clientPhone) {
            clientPhoneGlobal = clientPhone;
            // Listen for backend-log for new messages (optional, for debugging)
            if (window.io) {
                const socket = io();
                // Listen for a custom event for new WhatsApp messages (you must emit this from backend)
                socket.on('whatsapp-message', function(data) {
                    if (data && data.phone === clientPhoneGlobal) {
                        fetchChatHistory(clientPhoneGlobal).then(messages => {
                            renderChat(messages, clientPhoneGlobal, true);
                        });
                    }
                });
            }
            // Fallback: poll every 2 seconds for new messages
            setInterval(async () => {
                if (!clientPhoneGlobal) return;
                const messages = await fetchChatHistory(clientPhoneGlobal);
                // Only update if there are new messages
                if (messages.length && (!lastMessageId || messages[messages.length - 1].id !== lastMessageId)) {
                    renderChat(messages, clientPhoneGlobal, true);
                    lastMessageId = messages.length ? messages[messages.length - 1].id : null;
                }
            }, 2000);
        }

        // Initial load
        (async function() {
            const params = getUrlParams();
            const clientId = params.clientid;
            const clientName = params.name;
            const clientPhone = params.phonenumber;
            const leadId = params.lead_id;
            const userId = params.user_id;

            // Show in header
            document.getElementById('clientNameHeader').textContent = clientName ? clientName : '';
            document.getElementById('clientPhoneHeader').textContent = clientPhone ? clientPhone : '';
            document.getElementById('leadIdHeader').textContent = leadId ? `Lead ID: ${leadId}` : '';

            if (!clientId || !clientPhone || !leadId || !userId) {
                document.getElementById('chatHistory').innerHTML = '<div class="error">Missing client info in URL.</div>';
                document.getElementById('sendMessageForm').style.display = 'none';
                return;
            }
            document.getElementById('chatHistory').innerHTML = '<div class="loading">Loading chat history...</div>';
            try {
                const messages = await fetchChatHistory(clientPhone);
                if (messages.length === 0) {
                    document.getElementById('chatHistory').innerHTML = '<div class="empty">No messages found.</div>';
                } else {
                    renderChat(messages, clientPhone);
                    lastMessageId = messages.length ? messages[messages.length - 1].id : null;
                }
            } catch (err) {
                document.getElementById('chatHistory').innerHTML = '<div class="error">Failed to load chat history.</div>';
            }

            // Start realtime updates
            updateChatRealtime(clientPhone);

            // --- Send message form logic ---
            const sendForm = document.getElementById('sendMessageForm');
            const input = document.getElementById('messageInput');
            sendForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = input.value.trim();
                if (!msg) return;
                input.disabled = true;
                sendForm.querySelector('button').disabled = true;
                try {
                    await sendMessageToClient(
                        { clientId, name: clientName, phone: clientPhone, leadId, userId },
                        msg
                    );
                    input.value = '';
                    // Wait a moment to ensure WhatsApp has processed the message
                    setTimeout(async () => {
                        const messages = await fetchChatHistory(clientPhone);
                        renderChat(messages, clientPhone);
                        input.disabled = false;
                        sendForm.querySelector('button').disabled = false;
                        input.focus();
                    }, 1200); // 1.2s delay for WhatsApp to sync
                } catch (err) {
                    alert('Failed to send message: ' + (err.message || err));
                    input.disabled = false;
                    sendForm.querySelector('button').disabled = false;
                    input.focus();
                }
            });
        })();
    </script>
</body>
</html>
